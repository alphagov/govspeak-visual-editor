name: CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - ".git**"
  pull_request:

jobs:
  codeql-sast:
    name: CodeQL SAST scan
    uses: alphagov/govuk-infrastructure/.github/workflows/codeql-analysis.yml@main
    permissions:
      security-events: write

  dependency-review:
    name: Dependency Review scan
    uses: alphagov/govuk-infrastructure/.github/workflows/dependency-review.yml@main

  lint:
    uses: ./.github/workflows/lint.yml

  run-playwright-tests:
    uses: ./.github/workflows/playwright.yml

  prettier:
    uses: ./.github/workflows/prettier.yml

  vitest:
    uses: ./.github/workflows/vitest.yml

  release:
    needs: vitest
    permissions:
      contents: write
    uses: alphagov/govuk-infrastructure/.github/workflows/publish-npm-package.yml@main
    with:
      deploy_to_github_pages: false
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.ALPHAGOV_NPM_AUTOMATION_TOKEN }}

  notify-slack-if-failure-on-main:
    needs:
      - codeql-sast
      - dependency-review
      - lint
      - run-playwright-tests
      - vitest
      - release
    if: ${{ always() && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack if failure on main
        uses: alphagov/govuk-infrastructure/.github/actions/report-run-failure@main
        with:
          slack_webhook_url: ${{ secrets.GOVUK_SLACK_WEBHOOK_URL }}
          channel: govuk-whitehall-experience-tech
          message: "Govspeak Visual Editor CI failed on 'main' and blocked the deployment. Investigate!"
